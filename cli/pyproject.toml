[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundctl-cli"
version = "0.1.0"
description = "Command-line client for Groundctl, the content-lifecycle and patch-management control plane."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
groundctl = "groundctl_cli.main:run"

[tool.setuptools.packages.find]
include = ["groundctl_cli*"]
