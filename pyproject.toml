[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length is a soft target here, not a hard gate

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Non-blocking in CI (continue-on-error) — this codebase has zero prior
# type-check history; a hard-fail gate on day one would block on
# pre-existing code, not new regressions. See docs/limitations.md.
