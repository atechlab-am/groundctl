name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Pinned, not "pip install ruff" — an unpinned install let CI silently
      # jump to whatever's newest at run time. 0.16.2 briefly misreported a
      # real F821 (undefined name, tests/test_repositories.py) as an
      # "invalid-syntax: unexpected token NUL" parse error attributed to
      # the wrong file entirely (app/routers/repositories.py, which was
      # never involved) — confirmed by fixing the real bug and re-running
      # the exact same ruff version, which then passed clean. Pin so a
      # future ruff release can't reintroduce that kind of misleading
      # failure without it being a deliberate version bump someone reviews.
      - run: pip install ruff==0.16.2
      - run: ruff check app/ tests/

  typecheck:
    runs-on: ubuntu-latest
    # Non-blocking: this codebase has zero prior type-check history — a
    # hard-fail gate on day one would block on pre-existing code, not new
    # regressions. See docs/limitations.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Pinned, not "pip install mypy" — the unpinned install hit the same
      # class of issue ruff's install did above: mypy 2.3.0 reported
      # "Source code string cannot contain null bytes" for
      # app/routers/repositories.py, a file with zero null bytes (verified
      # byte-for-byte, and mypy==2.3.0 re-run against the identical content
      # here passed clean) — a transient runner/checkout artifact, not a
      # real defect. Pinning avoids re-hitting whatever that was on a
      # future run, and keeps mypy runs reproducible either way.
      - run: pip install mypy==2.3.0
      - run: pip install -r requirements.txt
      - run: mypy app/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile app/*.py app/routers/*.py
      - run: python -c "import app.main"
        env:
          DATABASE_URL: "postgresql+psycopg://groundctl:groundctl@localhost:5432/groundctl"
          JWT_SECRET: "ci_placeholder"
          ANSIBLE_PRIVATE_KEY_PATH: "/tmp/ci-keys/id_ed25519"
          REDIS_URL: "redis://localhost:6379/0"
      - name: bash syntax check
        run: |
          for f in install.sh install-relay.sh scripts/backup.sh scripts/groundctl-maintain.sh scripts/lib/*.sh; do
            bash -n "$f"
          done
      - name: ansible playbook syntax check
        run: |
          pip install ansible
          for f in app/ansible/playbooks/*.yml; do
            ansible-playbook --syntax-check "$f" -i localhost,
          done

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: groundctl_test
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: groundctl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v
        env:
          TEST_DATABASE_URL: "postgresql+psycopg://groundctl_test:testpass@localhost:5432/groundctl_test"
          REDIS_URL: "redis://localhost:6379/0"

  ui-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build

  cli-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - run: python -m py_compile groundctl_cli/*.py groundctl_cli/commands/*.py
      - run: pytest tests/ -v
