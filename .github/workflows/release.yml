name: Release

# Runs after CI finishes on `dev`. Two independent things happen here, on
# two independent gates — this split matters, see the "Fast-forward main
# to dev" step below for the real bug this fixes:
#   1. main ALWAYS fast-forwards to dev's latest commit whenever CI
#      passes — main tracks "code confirmed to build," continuously, not
#      just release checkpoints.
#   2. Tagging/creating a GitHub Release stays opt-in per-commit (bump
#      VERSION + add a CHANGELOG.md section in the same PR that should
#      ship) — this is the only part gated on should_release.
# See CHANGELOG.md's header and docs/releasing.md for the full
# contributor-facing procedure.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [dev]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
          # Default GITHUB_TOKEN pushes don't trigger other workflows, which
          # is fine here — pushing to main is the end of this pipeline, not
          # meant to re-trigger CI/release on main.

      - name: Check whether VERSION changed on this push
        id: version_check
        run: |
          CURRENT_VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

          if git rev-parse "v${CURRENT_VERSION}" >/dev/null 2>&1; then
            echo "tag v${CURRENT_VERSION} already exists — nothing to release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync README's version line to VERSION
        if: steps.version_check.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version_check.outputs.current_version }}
        run: |
          # README's "**Version:** [X.Y.Z](CHANGELOG.md#anchor)" line is
          # otherwise hand-maintained and reliably goes stale (found live —
          # it sat 5 releases behind before this step existed, see
          # CHANGELOG.md). Committed to dev BEFORE the fast-forward below,
          # so the corrected README rides along as part of the exact
          # commit that becomes main's new HEAD — no separate commit ever
          # lands on main directly, keeping this workflow's fast-forward-
          # only invariant (see docs/releasing.md) intact.
          #
          # Anchor mirrors GitHub's own markdown heading-to-anchor
          # slugification of "## [X.Y.Z] - YYYY-MM-DD": lowercase, drop
          # "[" "]" and ".", turn spaces into "-" (the literal " - "
          # becomes "--" since the existing hyphen survives alongside the
          # space-turned-hyphen on either side of it).
          HEADING="$(grep -m1 "^## \[${VERSION}\]" CHANGELOG.md)"
          if [ -z "${HEADING}" ]; then
            echo "::warning::No CHANGELOG.md section found for [${VERSION}] — skipping README version-line sync."
          else
            DATE="$(echo "${HEADING}" | sed -E 's/^## \[[^]]+\] - //')"
            ANCHOR="$(echo "${VERSION}${DATE:+---$DATE}" | tr -d '.' | tr '[:upper:]' '[:lower:]')"
            # "|" as the sed delimiter, not "#" — the replacement text
            # itself contains a literal "#" (the markdown anchor
            # fragment), which would prematurely end an s#...#...# form.
            sed -i -E "s|^\*\*Version:\*\* \[[0-9]+\.[0-9]+\.[0-9]+\]\(CHANGELOG\.md#[^)]+\)|**Version:** [${VERSION}](CHANGELOG.md#${ANCHOR})|" README.md

            if ! git diff --quiet -- README.md; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add README.md
              git commit -m "Synced README version line to v${VERSION}"
              git push origin HEAD:refs/heads/dev
            fi
          fi

      - name: Fast-forward main to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Fast-forward only, via a throwaway local ref — NOT `git
          # checkout main` in the job's own working tree, which would
          # leave every later step (VERSION check, CHANGELOG extraction)
          # reading main's stale files instead of dev's. Push
          # origin/dev's commit directly to refs/heads/main instead;
          # `--force-with-lease` here is safe/equivalent to a fast-
          # forward check because it's scoped to main's exact expected
          # current SHA, not an actual force-push over unknown state —
          # if main has moved since the `git fetch` above (e.g. a hotfix
          # landed directly on main), this fails loudly rather than
          # silently overwriting it.
          git push origin HEAD:refs/heads/main \
            --force-with-lease="main:$(git rev-parse origin/main)"
          # Runs on EVERY successful CI run on dev, unconditionally — a
          # real bug found live: this used to be gated behind
          # should_release below, so once a version was already tagged,
          # ANY further commit pushed to dev (even a perfectly good,
          # CI-passing one, e.g. a bug fix) never reached main at all
          # until the next VERSION bump — main silently stopped tracking
          # dev. Promoting tested code to main and cutting a version tag
          # are different questions; only the tag should wait on a
          # version bump.

      - name: Extract this version's CHANGELOG section
        if: steps.version_check.outputs.should_release == 'true'
        id: changelog
        env:
          # Via env, not interpolated with ${{ }} into the script body —
          # see the "Tag and create GitHub Release" step below for why.
          VERSION: ${{ steps.version_check.outputs.current_version }}
        run: |
          # Pull the section between "## [$VERSION]" and the next "## [" —
          # fails loudly (empty notes) rather than silently if CHANGELOG.md
          # wasn't updated to match VERSION, since that's a real authoring
          # mistake worth surfacing in the release body, not masking.
          NOTES="$(awk -v ver="[$VERSION]" '
            /^\[.+\]: http/ { if (found) exit }
            $0 ~ "^## \\[" { if (found) exit; if (index($0, ver)) { found=1; next } }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::warning::No CHANGELOG.md section found for [${VERSION}] — release notes will be empty. Add a '## [${VERSION}] - YYYY-MM-DD' section."
          fi
          {
            echo "notes<<GROUNDCTL_CHANGELOG_EOF"
            echo "$NOTES"
            echo "GROUNDCTL_CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Tag and create GitHub Release
        if: steps.version_check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version_check.outputs.current_version }}
          # Passed via env, NOT interpolated into the run: script with
          # ${{ }} — the changelog excerpt is arbitrary multi-line text
          # that GitHub Actions would otherwise substitute into the
          # script's source BEFORE the shell runs it.
          RELEASE_NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          # --notes-file - (stdin) rather than --notes "${RELEASE_NOTES}"
          # as a CLI argument: bash's parameter expansion inside double
          # quotes does not re-tokenize the expanded value (a literal `"`
          # in $RELEASE_NOTES stays inert data, verified locally), so the
          # --notes form is not actually unsafe here — but the notes are
          # free-form changelog prose that will keep containing quotes,
          # backticks, and arbitrary punctuation release over release.
          # Piping via stdin sidesteps argument-construction entirely
          # (no quoting to reason about at all) rather than relying on
          # bash's expansion semantics staying correct as this evolves.
          gh release create "v${VERSION}" \
            --target main \
            --title "v${VERSION}" \
            --notes-file - <<< "${RELEASE_NOTES}"
