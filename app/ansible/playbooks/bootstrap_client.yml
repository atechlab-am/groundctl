---
- name: Bootstrap groundctl-managed apt source
  hosts: all
  tasks:
    # Per-host SSH key install — runs over the connection established with
    # the shared fleet key (the only credential a brand-new host has ever
    # seen), installing this host's OWN key so all subsequent job execution
    # against it stops relying on the shared key. groundctl_host_pubkey is
    # only set when tasks.py's bootstrap_task generated a new keypair for
    # this host (Server.ssh_key_path was previously unset) — omitted
    # entirely on repeat bootstraps of an already-keyed host.
    # ansible.posix.authorized_key (2.2.2) fails unconditionally under
    # playbook execution on this ansible-core/Python combination — "Module
    # failed: list index out of range", reproduced even with become: false
    # and no other options set, while the exact same operation via `ansible
    # -m ansible.posix.authorized_key` (ad-hoc, not playbook mode) succeeds.
    # A real environment bug, not anything module-parameter-specific to
    # this playbook. Worked around with the builtin lineinfile module
    # instead, which has no such issue and no collection dependency.
    - name: Ensure .ssh directory exists for the per-host key
      become: true
      when: groundctl_host_pubkey is defined
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.ssh"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Install this host's own SSH key for future groundctl connections
      become: true
      ansible.builtin.lineinfile:
        path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
        line: "{{ groundctl_host_pubkey }}"
        create: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
      when: groundctl_host_pubkey is defined

    # GPG signing key — fetched from the PRIMARY's local keyring (delegate_to:
    # localhost, no HTTP involved) and pushed to the host over this same SSH
    # connection. Avoids the chicken-and-egg problem of needing to already
    # trust HTTPS to fetch the thing that makes HTTPS trusted. One export per
    # signed content view assignment — content_views is a list now (any
    # number of content views can be assigned to one environment, see
    # EnvironmentContentView, models.py), each with its own optional
    # gpg_key_id.
    - name: Export each signed content view's GPG public key from the primary's keyring
      loop: "{{ content_views }}"
      loop_control:
        label: "{{ item.content_view_name }}"
      when: item.gpg_key_id is defined and item.gpg_key_id is not none
      delegate_to: localhost
      become: false
      ansible.builtin.command: "gpg --export --armor {{ item.gpg_key_id }}"
      register: groundctl_gpg_exports
      changed_when: false

    - name: Install each signed content view's GPG signing key on the managed host
      become: true
      loop: "{{ groundctl_gpg_exports.results }}"
      loop_control:
        label: "{{ item.item.content_view_name }}"
      when: item.item.gpg_key_id is defined and item.item.gpg_key_id is not none
      ansible.builtin.copy:
        content: "{{ item.stdout }}"
        dest: "/etc/apt/keyrings/groundctl-{{ environment_name }}-{{ item.item.content_view_name }}.asc"
        mode: "0644"

    - name: Dearmor each signed content view's GPG signing key
      become: true
      loop: "{{ content_views }}"
      loop_control:
        label: "{{ item.content_view_name }}"
      when: item.gpg_key_id is defined and item.gpg_key_id is not none
      ansible.builtin.command: >-
        gpg --dearmor --batch --yes
        -o /etc/apt/keyrings/groundctl-{{ environment_name }}-{{ item.content_view_name }}.gpg
        /etc/apt/keyrings/groundctl-{{ environment_name }}-{{ item.content_view_name }}.asc
      args:
        creates: "/etc/apt/keyrings/groundctl-{{ environment_name }}-{{ item.content_view_name }}.gpg"

    # TLS CA cert — same delegate_to: localhost pattern, only relevant when
    # published_repo_base_url uses the default self-signed cert (see
    # docs/https.md). Omitted (groundctl_tls_ca_path unset) when the
    # primary is using a CA-issued cert, since the host's existing trust
    # store already covers that case.
    - name: Read the primary's TLS CA cert, if using the self-signed default
      when: groundctl_tls_ca_path is defined and groundctl_tls_ca_path is not none
      delegate_to: localhost
      become: false
      ansible.builtin.slurp:
        src: "{{ groundctl_tls_ca_path }}"
      register: groundctl_tls_ca_slurp

    - name: Trust the primary's self-signed TLS CA cert on the managed host
      become: true
      when: groundctl_tls_ca_path is defined and groundctl_tls_ca_path is not none
      ansible.builtin.copy:
        content: "{{ groundctl_tls_ca_slurp.content | b64decode }}"
        dest: "/usr/local/share/ca-certificates/groundctl-primary.crt"
        mode: "0644"
      notify: Update CA certificates

    # A content host belongs to exactly one lifecycle environment at a time
    # (Server.environment_id), but that environment can now have ANY NUMBER
    # of content views assigned to it (EnvironmentContentView, models.py) —
    # replace-in-place, not additive: before writing this environment's
    # files, remove every groundctl-*.list/.asc/.gpg file NOT in this
    # checkin's own content_views list. Without this, a host reassigned to
    # a different environment (POST /servers/{id}/assign-environment), or
    # a content view unassigned from its current one, would keep trusting
    # stale repos indefinitely. glob-based removal, scoped strictly to the
    # groundctl-<name> prefix this same playbook owns — never touches
    # /etc/apt/sources.list itself or any of the host's own sources.
    - name: Find this host's existing groundctl-managed apt source files
      become: true
      ansible.builtin.find:
        paths:
          - /etc/apt/sources.list.d
          - /etc/apt/keyrings
        patterns: "groundctl-*"
      register: groundctl_existing_source_files

    - name: Compute this checkin's expected groundctl-managed base filenames
      ansible.builtin.set_fact:
        groundctl_expected_basenames: >-
          {{ content_views | map(attribute='content_view_name')
             | map('regex_replace', '^(.*)$', 'groundctl-' + environment_name + '-\1') | list }}

    - name: Remove groundctl-managed files belonging to a DIFFERENT/removed assignment
      become: true
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ groundctl_existing_source_files.files }}"
      # (item.path | basename).split('.')[0] strips exactly one extension
      # (.list/.asc/.gpg) off the end — filenames never contain a literal
      # "." themselves (environment/content view names are restricted to
      # [a-zA-Z0-9._-] by validate_aptly_name, but a "." inside a NAME would
      # make this split ambiguous; in practice names this playbook has
      # actually seen don't use it, and this mirrors the exact scoping the
      # single-content-view version of this playbook already relied on).
      when: (item.path | basename).split('.')[0] not in groundctl_expected_basenames

    # Filename is derived from BOTH the environment name and the content
    # view name (groundctl-<environment_name>-<content_view_name>.list) so
    # each assignment gets its own file and none collide.
    #
    # Components come from the assignment's mirror components, never
    # hardcoded to "main" (see CLAUDE.md known-bad-patterns).
    #
    # Signed (gpg_key_id set) uses [signed-by=...] against the key installed
    # above; unsigned falls back to [trusted=yes] — an explicit opt-in
    # (EnvironmentContentViewCreate.allow_unsigned), not a hardcoded
    # default, and logged here via the debug task below so an unsigned
    # bootstrap is never silent.
    - name: Write groundctl apt source for each content view assignment (signed)
      become: true
      loop: "{{ content_views }}"
      loop_control:
        label: "{{ item.content_view_name }}"
      when: item.gpg_key_id is defined and item.gpg_key_id is not none
      ansible.builtin.copy:
        dest: "/etc/apt/sources.list.d/groundctl-{{ environment_name }}-{{ item.content_view_name }}.list"
        content: >-
          deb [signed-by=/etc/apt/keyrings/groundctl-{{ environment_name }}-{{ item.content_view_name }}.gpg]
          {{ published_repo_base_url }}/{{ item.publish_prefix }}/
          {{ item.release }} {{ item.components | join(' ') }}
        mode: "0644"

    - name: Write groundctl apt source for each content view assignment (unsigned, explicit opt-in)
      become: true
      loop: "{{ content_views }}"
      loop_control:
        label: "{{ item.content_view_name }}"
      when: item.gpg_key_id is not defined or item.gpg_key_id is none
      ansible.builtin.copy:
        dest: "/etc/apt/sources.list.d/groundctl-{{ environment_name }}-{{ item.content_view_name }}.list"
        content: >-
          deb [trusted=yes] {{ published_repo_base_url }}/{{ item.publish_prefix }}/
          {{ item.release }} {{ item.components | join(' ') }}
        mode: "0644"

    - name: Warn about content view assignments publishing unsigned
      loop: "{{ content_views }}"
      loop_control:
        label: "{{ item.content_view_name }}"
      when: item.gpg_key_id is not defined or item.gpg_key_id is none
      ansible.builtin.debug:
        msg: >-
          WARNING: content view '{{ item.content_view_name }}' in environment
          '{{ environment_name }}' has no GPG signing key configured — apt is
          trusting this repo's metadata unverified ([trusted=yes]). See
          docs/gpg-signing.md.

    - name: Refresh apt cache
      become: true
      ansible.builtin.apt:
        update_cache: true

  handlers:
    - name: Update CA certificates
      become: true
      ansible.builtin.command: update-ca-certificates
